<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Craftmake React Prototype</title>
    <script type="text/javascript">
      var userAgent = window.navigator.userAgent.toLowerCase();
      if (
        (userAgent.indexOf('msie') === -1 && userAgent.indexOf('trident') === -1) &&
        !document.querySelector('#stands_onbd_point')
      ) {
        var ONB = ONB || {};
        ONB.ignition_url = 'https://api.onboarding-app.io/v1/onboarding-init?aid=2&pid=398';

        // Custom Area Start=====================
        ONB._queryparam = {
          user_id: 'ユーザID',
          user_name: 'ユーザ名',
          user_group_id: '企業ID',
          user_group_name: '企業名'
        };
        ONB.black_list = [];
        ONB._custom_functions = {};
        // Custom Area End======================

        ONB.embed = function () {
          for (ONB.item in ONB._queryparam) {
            ONB.ignition_url +=
              '&' + ONB.item + '=' + encodeURIComponent(ONB._queryparam[ONB.item]);
          }
          for (ONB.d = 0; ONB.d < ONB.black_list.length; ONB.d++) {
            if (location.href.indexOf(ONB.black_list[ONB.d]) !== -1) {
              return;
            }
          }
          if (Object.keys(ONB._custom_functions).length > 0) {
            ONB.ignition_url +=
              '&custom_functions=' +
              encodeURIComponent(JSON.stringify(ONB._custom_functions));
          }
          ONB.b = document.createElement('script');
          ONB.c = document.getElementsByTagName('head')[0];
          ONB.b.src = ONB.ignition_url;
          ONB.b.id = 'stands_onbd_point';
          ONB.b.charset = 'utf-8';
          ONB.b.async = 'async';
          ONB.c.appendChild(ONB.b);
        };
        ONB.embed();
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
